services:
  expensecontrol-postgres:
    image: postgres:16
    container_name: expensecontrol-postgres
    environment:
      - POSTGRES_DB=ExpenseControlDb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=ExpenseControl123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - expensecontrol-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ExpenseControlDb -h localhost || exit 1; psql -U postgres -d ExpenseControlDb -c 'SELECT 1;' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: ./ExpenseControl.Api/docker/Dockerfile
    container_name: expensecontrol-api
    ports:
      - "5293:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      expensecontrol-postgres:
        condition: service_healthy
    networks:
      - expensecontrol-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: ./expense-control-react/docker/Dockerfile
    container_name: expensecontrol-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - expensecontrol-network

volumes:
  postgres_data:

networks:
  expensecontrol-network:
    driver: bridge