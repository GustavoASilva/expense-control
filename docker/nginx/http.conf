upstream expensecontrol_frontend {
    server frontend:80;
}

upstream expensecontrol_api {
    server api:80;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Proxy API requests to the internal API service.
    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://expensecontrol_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve the SPA through the internal frontend service.
    location / {
        proxy_pass http://expensecontrol_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
